[workspace]
resolver = "2"
members = ["crates/msg-notice", "crates/act-approve", "crates/cal-explain", "crates/demo-read-before-act"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Leif Rydenfalk <59741378+Leif-Rydenfalk@users.noreply.github.com>"]
repository = "https://github.com/ce-net/demo-read-before-act"

[workspace.dependencies]
# The open capability token (cap v3), CAL and the verifier: https://github.com/ce-net/ce-net-proto (Apache-2.0)
ce-net-proto = { git = "https://github.com/ce-net/ce-net-proto", rev = "ff449250618cc70bde491055cb97e8ef42121390" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bincode = "1"
tiny_http = "0.12"
msg-notice = { path = "crates/msg-notice" }
act-approve = { path = "crates/act-approve" }
cal-explain = { path = "crates/cal-explain" }
